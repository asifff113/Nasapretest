# Part of CaseFile Earth. Written with AI assistance; see docs/AI_USE.md.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: python
        run: uv sync --extra pipeline     # the pipeline tests need xarray, shapely, earthaccess (build plan, integration check)
      - name: Engine golden self-check (60/60)
        working-directory: python
        run: uv run casefile-engine selfcheck
      - name: Fast tests
        working-directory: python
        run: uv run pytest -m "not slow"
      - name: Validate the package (examples, config, i18n parity)
        run: uv run --project python python tools/validate_pack.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Does web/ exist yet?
        id: has_web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "web/package.json not found: skipping (Part 3 adds it)"; fi
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, lint, unit tests, end-to-end tests
        if: steps.has_web.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
