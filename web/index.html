<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--csp-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CaseFile Earth tests whether temperature or rain really changed in Bangladesh and nearby regions, using NASA data, and shows the evidence in English and Bangla." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 8a2 2 0 0 1 2-2h7l3 3h10a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z' fill='%23B87514'/%3E%3Cpath d='M9 20l4-4 3 3 6-7' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>CaseFile Earth</title>
    <script>
      // Apply the saved theme and language before first paint (no flash). Storage may be blocked: ignore errors.
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('cfe.theme');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) d.classList.add('dark');
          var l = localStorage.getItem('cfe.lang');
          if (l === 'bn') d.lang = 'bn';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
