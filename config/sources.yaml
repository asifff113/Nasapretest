# Products behind the variables. Source of truth for provenance, citations and the access checks.
# Only fact-checked items are stated as facts (playbook v3 6.2). Anything marked VERIFY is checked in the
# access-check table (docs/02_DATA.md §10) before it is relied on; doi_verified: false means the same.
version: 3
sources:
  # ------------------------------------------------------------------ first release
  - id: merra2_slv
    status: first_release
    name: "MERRA-2 monthly single-level diagnostics"
    short_name: M2TMNXSLV
    version: "5.12.4"
    provider: GES_DISC (Earthdata Cloud)
    kind: model
    doi: "10.5067/AP1B0BA5PD2K"
    doi_verified: true                   # fact-check #14 (v3 6.2)
    temporal: { start: "1980-01", end: "latest complete month (VERIFY V-03)" }
    grid: { id: merra2_native, native: "0.625° longitude × 0.5° latitude, 576 × 361 points (GMAO page, opened 2 Nov 2026)" }
    access:
      route: earthaccess
      find: "CMR query by short name and version; never hard-coded file names (stream prefixes change over the record)"
      method: cloud_opendap_subset       # fallback: whole-file download, subset locally
      variables: [T2M, TQV, SLP]           # TQV and SLP: exploration layers (water vapour, air pressure)
      fill: "VERIFY V-03 (v2 notes: _FillValue 1e15; mask > 1e14)"
    citation: "Global Modeling and Assimilation Office (GMAO) (2015), MERRA-2 tavgM_2d_slv_Nx: 2d, Monthly mean, Time-Averaged, Single-Level, Assimilation, Single-Level Diagnostics V5.12.4, Greenbelt, MD, USA, Goddard Earth Sciences Data and Information Services Center (GES DISC), doi:10.5067/AP1B0BA5PD2K."
    reference: "Gelaro, R., et al. (2017), The Modern-Era Retrospective Analysis for Research and Applications, Version 2 (MERRA-2), J. Climate, 30, 5419–5454."
    licence: "NASA open data"
    known_breaks: [merra2_observing_system]
    traps: "Model output; observing-system changes shift reanalysis fields."

  - id: merra2_precip
    status: first_release
    name: "MERRA-2 tavgM_2d_flx_Nx: monthly mean surface flux diagnostics (holds PRECTOTCORR, bias-corrected total precipitation)"
    short_name: M2TMNXFLX
    version: "5.12.4"
    provider: GES_DISC (Earthdata Cloud)
    kind: model
    doi: "10.5067/0JRLVL8YV2Y4"
    doi_verified: true                   # data.nasa.gov entry for M2TMNXFLX V5.12.4, read 3 Nov 2026; V-03 still opens one granule
    temporal: { start: "1980-01", end: "latest complete month (VERIFY V-03)" }
    grid: { id: merra2_native, native: "0.625° × 0.5°, 576 × 361" }
    access:
      route: earthaccess
      find: "CMR query by short name and version; V-03 confirms PRECTOTCORR in one monthly granule (the MERRA-2 flux collection lists it: Earth Engine catalog, hourly flux collection)"
      method: cloud_opendap_subset
      variables: [PRECTOTCORR, PRECSNO, SPEED]   # PRECSNO (snowfall) and SPEED (wind speed): exploration layers
      units: "kg m-2 s-1 (bias-corrected precipitation, fact-check #14); × 86 400 → mm/day"
      fill: "VERIFY V-03"
    citation: "Global Modeling and Assimilation Office (GMAO) (2015), MERRA-2 tavgM_2d_flx_Nx: 2d, Monthly mean, Time-Averaged, Single-Level, Assimilation, Surface Flux Diagnostics V5.12.4, Greenbelt, MD, USA, Goddard Earth Sciences Data and Information Services Center (GES DISC), doi:10.5067/0JRLVL8YV2Y4."
    reference: "Reichle, R. H., et al. (2017), Land surface precipitation in MERRA-2, J. Climate, 30, 1643–1664 (VERIFY before citing)."
    licence: "NASA open data"
    known_breaks: [merra2_observing_system, merra2_precip_correction_inputs]
    traps: "Model output corrected with gauge and satellite estimates whose inputs changed over time."

  # ------------------------------------------------------------------ sensitivity check (rain)
  - id: imerg_v07_final_monthly
    status: sensitivity
    name: "GPM IMERG Final Precipitation L3 1 month 0.1° V07"
    short_name: GPM_3IMERGM
    version: "07"
    provider: GES_DISC (Earthdata Cloud)
    kind: satellite
    doi: "10.5067/GPM/IMERG/3B-MONTH/07"
    doi_verified: true                   # fact-check #11c
    temporal: { start: "1998-01", end: "2025-09" }   # Final record starts Jan 1998 (#11b) and ends Sep 2025 (#11a; GPM page re-checked 2 Nov 2026)
    grid: { id: imerg_native, native: "0.1°; arrays arrive (time, lon, lat): transpose" }
    access:
      route: earthaccess
      find: "CMR query by short name and version 07; pin V07; never append Late Run or V08 (V08 Final expected in fall 2026)"
      method: cloud_opendap_subset       # HDF5 group "Grid"
      variables: [precipitation]
      units: "mm/hr (#11c; also shown in an HDF Group sample IMERG monthly file); × 24 → mm/day. V-04 confirms in a V07 granule"
      fill: "-9999.9 in the same sample file; V-04 confirms in a V07 granule"
      subset_bbox: [80.0, 15.0, 100.0, 30.0]   # region-set box (W, S, E, N); extend if a comparison region lies outside
    citation: "Huffman, G.J., E.F. Stocker, D.T. Bolvin, E.J. Nelkin, J. Tan (2023), GPM IMERG Final Precipitation L3 1 month 0.1 degree x 0.1 degree V07, Greenbelt, MD, GES DISC, doi:10.5067/GPM/IMERG/3B-MONTH/07."
    reference: "Huffman, G. J., et al., IMERG Algorithm Theoretical Basis Document, V07."
    licence: "NASA open data"
    known_breaks: [imerg_trmm_to_gpm_2014, imerg_v07_final_end]
    traps: "A rate, not a total; annual trends end in 2024; never splice Late Run or V08."

  # ------------------------------------------------------------------ reference and checks
  - id: gistemp_v4
    status: reference
    name: "NASA GISS Surface Temperature Analysis, version 4 (global mean series only)"
    short_name: GISTEMP
    version: "v4"
    provider: NASA GISS
    kind: observations
    doi: null
    doi_verified: true
    temporal: { start: "1880-01", end: "latest" }
    grid: { id: series, native: "global mean series; grid and base period VERIFY V-08 (#22)" }
    access: { route: csv, url: "https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts+dSST.csv" }
    citation: "GISTEMP Team (2026), GISS Surface Temperature Analysis (GISTEMP), version 4. NASA Goddard Institute for Space Studies. Dataset accessed <date>."
    reference: "Lenssen, N., et al. (2024), A NASA GISTEMPv4 observational uncertainty ensemble, J. Geophys. Res. Atmos., doi:10.1029/2023JD040179 (fact-check #22)."
    licence: "NASA open data"
    known_breaks: []
    traps: "Used only for the known-answer test and as a labelled reference line; never graded."

  - id: power
    status: check
    name: "NASA Prediction Of Worldwide Energy Resources (POWER)"
    short_name: POWER
    version: "API version VERIFY V-07"
    provider: NASA Langley Research Center
    kind: model
    doi: null
    doi_verified: true
    temporal: { start: "1981-01 (weather, from MERRA-2); IMERG_PRECTOT from 1998-06-01", end: "about 2 months (weather) and about 3.5 months (IMERG) before real time" }
    grid: { id: power, native: "MERRA-2 grid for weather; a GEOS-IT tail with about two days' latency, later overwritten (#29a)" }
    access:
      route: power_api
      endpoint: "/api/temporal/monthly/point on power.larc.nasa.gov; start and end are years; up to 20 parameters per point request, one per regional request (documentation, read 3 Nov 2026). VERIFY V-07: fill -999, annual key, licence (#30)"
      parameters: [T2M, PRECTOTCORR]
    citation: "These data were obtained from the NASA Langley Research Center (LaRC) POWER Project funded through the NASA Earth Science/Applied Science Program."
    reference: "NASA POWER Data Methodology, https://power.larc.nasa.gov/docs/methodology/ ; daily T2M against GSOD stations: bias −0.53 °C, RMSE 2.10 °C, R² 0.97 (#29)."
    licence: "VERIFY V-07"
    known_breaks: []
    traps: "Second-route check of one pipeline series and a fallback route only. POWER's weather is MERRA-2, so it is never a witness for MERRA-2, and POWER's IMERG never witnesses IMERG."

  # ------------------------------------------------------------------ exploration layers (globe and place reports only; not in the pre-registration, no verdicts)
  - id: gldas_noah10_m
    status: exploration
    name: "GLDAS Noah Land Surface Model L4 monthly 1.0° V2.1"
    short_name: GLDAS_NOAH10_M
    version: "2.1"
    provider: GES_DISC (Earthdata Cloud)
    kind: model
    doi: "10.5067/LWTYSMP3VM5Z"
    doi_verified: true                   # CMR collection C1288937542-GES_DISC and GLDAS-2 README Table 2 (read 13 Nov 2026)
    temporal: { start: "2000-01", end: present }   # CMR: from 2000-01-01, ends at present; 319 monthly granules 2000-01..2026-07 on 13 Nov 2026
    grid: { id: gldas_1deg, native: "1.0°, 360 × 150 cells from 179.5° W 59.5° S (README Table 1); land only: sea and inland water hold the fill" }
    access:
      route: earthaccess
      find: "CMR query by short name and version 2.1 (main product; never the Early Product GLDAS_NOAH10_M_EP)"
      method: cloud_opendap_subset       # fallback: whole-file download (about 8 MB a month)
      variables: [Evap_tavg, Qs_acc, Qsb_acc, SoilMoi0_10cm_inst]   # soil moisture: exploration, descriptive
      units: "Evap_tavg kg m-2 s-1 (mean rate) × 86 400 → mm/day; Qs_acc and Qsb_acc kg m-2 per 3 hours averaged over the month (README §3.5 item 6) × 8 → mm/day; read in GLDAS_NOAH10_M.A202007.021.nc4"
      fill: "-9999 (_FillValue and missing_value in the same granule)"
    citation: "Beaudoing, H. and M. Rodell, NASA/GSFC/HSL (2020), GLDAS Noah Land Surface Model L4 monthly 1.0 x 1.0 degree V2.1, Greenbelt, Maryland, USA, Goddard Earth Sciences Data and Information Services Center (GES DISC), doi:10.5067/LWTYSMP3VM5Z."
    reference: "Rodell, M., et al. (2004), The Global Land Data Assimilation System, BAMS, 85, 381–394."
    licence: "NASA open data"
    known_breaks: [gldas21_forcing_changes]
    traps: "Model output, not a measurement; its inputs changed over time (README §1.2.3, §1.5.3). Land only, 60° S to 90° N; no river routing."

  - id: modis_vegetation
    status: exploration
    name: "MODIS/Terra Vegetation Indices Monthly L3 Global 0.05Deg CMG V061"
    short_name: MOD13C2
    version: "061"
    provider: LPCLOUD (Earthdata Cloud)
    kind: satellite
    doi: "10.5067/MODIS/MOD13C2.061"
    doi_verified: true                   # CMR collection C2565788914-LPCLOUD (read 14 Nov 2026)
    temporal: { start: "2000-02", end: present }   # CMR: from 2000-02-01, ends at present; 321 monthly granules on 14 Nov 2026
    grid: { id: modis_05deg, native: "0.05° CMG, 7200 × 3600 cells, centres 89.975° N…89.975° S, 179.975° W…179.975° E (read in MOD13C2.A2020001.061); averaged to 0.5° in the reader (sources/modis.py)" }
    access:
      route: earthaccess
      find: "CMR query by short name MOD13C2 and version 061 (Earthdata Cloud, LPCLOUD; Earth Engine is not used)"
      method: cloud_opendap_subset       # the archive files are HDF-EOS2 (HDF4); the cloud OPeNDAP server returns the variable as NetCDF-4
      variables: [CMG_0_05_Deg_Monthly_NDVI]   # group MOD_Grid_monthly_CMG_VI/Data_Fields; Latitude and Longitude in MOD_Grid_monthly_CMG_VI
      units: "NDVI, int16, scale 0.0001 (MOD13 User Guide v3.10, Table 19); the file's scale_factor 10000 is the MODIS divisor convention for the same scale"
      fill: "-3000; valid range -2000..10000 (User Guide Table 19; the same in the granule)"
    citation: "Didan, K. (2021), MODIS/Terra Vegetation Indices Monthly L3 Global 0.05Deg CMG V061, NASA Land Processes Distributed Active Archive Center, Sioux Falls, South Dakota, USA, doi:10.5067/MODIS/MOD13C2.061."
    reference: "Didan, K. and A. Barreto Munoz (2019), MODIS Vegetation Index User's Guide (MOD13 Series), Version 3.10, Collection 6.1, Vegetation Index and Phenology Lab, The University of Arizona."
    licence: "NASA open data (Earthdata data use policy, CMR UseConstraints)"
    known_breaks: [terra_orbit_drift]
    traps: "Cloudy pixels are filled from the long-term MODIS average (pixel reliability rank 4, User Guide §8.1, §9), so trends are damped where clouds persist; Terra's orbit is drifting (#21). Land only."

