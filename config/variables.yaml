# Variables and their record cards (M1). The pipeline compiles this file into results/<build>/catalog.json
# (schemas/catalog.schema.json). Every user-visible text is here in English and Bangla.
#
# status: analysed     — first release; gets verdicts inside the validated domain (air_temp, rain)
#         sensitivity  — shown beside an analysed variable, never graded (rain_imerg)
#         reference    — known-answer test and a labelled reference line only (global_temp_gistemp)
#         deferred     — keeps its card, marked "not analysed in this release"; returns one product at a time
# record_card fields (v3 M1): record length, gaps, known breaks, observation or model, what it cannot answer.
version: 3
variables:
  # ---------------------------------------------------------------- analysed
  - id: air_temp
    status: analysed
    group: heat
    kind: model
    source: merra2_slv
    variable: T2M
    conversion: "K − 273.15 → °C"
    name: { en: "Air temperature near the ground", bn: "ভূপৃষ্ঠের কাছের বাতাসের তাপমাত্রা" }
    name_mid: { en: "air temperature near the ground", bn: "ভূপৃষ্ঠের কাছের বাতাসের তাপমাত্রা" }
    definition:
      en: "How warm the air is 2 metres above the ground, averaged over day and night."
      bn: "মাটি থেকে ২ মিটার ওপরে বাতাস কতটা উষ্ণ, দিন-রাত মিলিয়ে গড়।"
    how_measured:
      en: "From MERRA-2, a NASA model that blends weather observations from satellites, balloons and stations."
      bn: "MERRA-2 থেকে — নাসার একটি মডেল, যা স্যাটেলাইট, বেলুন ও আবহাওয়া কেন্দ্রের পর্যবেক্ষণ মিলিয়ে তৈরি।"
    units: { monthly: "°C", aggregated: "°C" }
    rule: mean
    ratio_scale: false
    record: { from: 1980, to: null }          # to: the last complete year in the input manifest
    record_card:
      gaps: { en: "None: the model fills every month.", bn: "নেই: মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system]
      observation_or_model:
        en: "Model output (a reanalysis): it blends many observations, but it is not a thermometer reading."
        bn: "মডেলের ফল (রিঅ্যানালাইসিস): অনেক পর্যবেক্ষণ মেলানো, তবে থার্মোমিটারের সরাসরি মাপ নয়।"
      cannot_answer:
        en: "It cannot show the heat of one city or street (each cell is about 55 × 64 km over Bangladesh), and it cannot say why the temperature changed."
        bn: "এটি একটি শহর বা রাস্তার গরম দেখাতে পারে না (বাংলাদেশের ওপর প্রতিটি ঘর প্রায় ৫৫ × ৬৪ কিমি), আর তাপমাত্রা কেন বদলেছে তা-ও বলতে পারে না।"
    colormap: { trend: RdBu_r, value: inferno }
    valid_range: [-80, 50]
    tags: [heat, everyday]

  - id: rain
    status: analysed
    group: water
    kind: model
    source: merra2_precip
    variable: PRECTOTCORR
    conversion: "kg m⁻² s⁻¹ × 86 400 → mm day⁻¹ (monthly); totals = Σ mm day⁻¹ × days"
    name: { en: "Rain and snowfall", bn: "বৃষ্টি ও তুষারপাত" }
    name_mid: { en: "rain and snowfall", bn: "বৃষ্টি ও তুষারপাত" }
    definition:
      en: "How much water falls from the sky as rain or snow, added up over the season or year."
      bn: "আকাশ থেকে বৃষ্টি বা তুষার হয়ে কতটা পানি পড়ে — ঋতু বা বছর ধরে যোগ করে।"
    how_measured:
      en: "From MERRA-2, a NASA model whose rain is corrected with rain-gauge and satellite estimates."
      bn: "MERRA-2 থেকে — নাসার একটি মডেল, যার বৃষ্টির হিসাব বৃষ্টিমাপক যন্ত্র ও স্যাটেলাইটের অনুমান দিয়ে সংশোধিত।"
    units: { monthly: "mm/day", aggregated: "mm" }
    rule: sum
    ratio_scale: true
    record: { from: 1980, to: null }
    record_card:
      gaps: { en: "None: the model fills every month.", bn: "নেই: মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system, merra2_precip_correction_inputs]
      observation_or_model:
        en: "Model output, corrected with gauge and satellite estimates whose inputs changed over time."
        bn: "মডেলের ফল, যা বৃষ্টিমাপক যন্ত্র ও স্যাটেলাইটের অনুমান দিয়ে সংশোধিত; এই উৎসগুলো সময়ের সঙ্গে বদলেছে।"
      cannot_answer:
        en: "It cannot show single storms, floods or the rain in one town, and it is not a rain-gauge record."
        bn: "এটি একক ঝড়, বন্যা বা একটি শহরের বৃষ্টি দেখাতে পারে না, আর এটি বৃষ্টিমাপক যন্ত্রের রেকর্ডও নয়।"
    sensitivity: rain_imerg
    colormap: { trend: BrBG, value: Blues }
    valid_range: [0, 300]                # mm/day; a unit check, not a weather limit: real monthly grid values reach 151 (MERRA-2, 1980-2025)
    tags: [water, everyday, monsoon]

  # ---------------------------------------------------------------- sensitivity
  - id: rain_imerg
    status: sensitivity
    group: water
    kind: satellite
    source: imerg_v07_final_monthly
    variable: precipitation
    conversion: "mm h⁻¹ × 24 → mm day⁻¹ (monthly); totals = Σ mm day⁻¹ × days"
    name: { en: "Rain and snowfall (IMERG, satellites and gauges)", bn: "বৃষ্টি ও তুষারপাত (IMERG, স্যাটেলাইট ও বৃষ্টিমাপক)" }
    name_mid: { en: "rain and snowfall in IMERG", bn: "IMERG-এ বৃষ্টি ও তুষারপাত" }
    definition:
      en: "The same quantity as rain, from a different record, used to check whether the answer depends on the dataset."
      bn: "বৃষ্টির একই পরিমাপ, তবে ভিন্ন রেকর্ড থেকে — উত্তরটি ডেটাসেটের ওপর নির্ভর করে কি না, তা যাচাইয়ের জন্য।"
    how_measured:
      en: "From GPM IMERG Final, which merges a fleet of satellites with rain gauges."
      bn: "GPM IMERG Final থেকে — এটি একঝাঁক স্যাটেলাইটের পরিমাপ ও বৃষ্টিমাপক যন্ত্রের তথ্য মেলায়।"
    units: { monthly: "mm/day", aggregated: "mm" }
    rule: sum
    ratio_scale: true
    record: { from: 1998, to: 2024 }          # Final record ends Sep 2025, so annual trends end in 2024
    record_card:
      gaps: { en: "None from Jan 1998 to Sep 2025. Years after 2024 are not used.", bn: "জানুয়ারি ১৯৯৮ থেকে সেপ্টেম্বর ২০২৫ পর্যন্ত নেই। ২০২৪-এর পরের বছর ব্যবহার হয় না।" }
      known_breaks: [imerg_trmm_to_gpm_2014, imerg_v07_final_end]
      observation_or_model:
        en: "Satellite measurements calibrated with rain gauges. Both this and MERRA-2's corrected rain use gauges, so they are not independent."
        bn: "বৃষ্টিমাপক যন্ত্র দিয়ে মিলিয়ে নেওয়া স্যাটেলাইটের মাপ। এটি ও MERRA-2-এর সংশোধিত বৃষ্টি — দুটিই বৃষ্টিমাপক ব্যবহার করে, তাই এরা স্বাধীন নয়।"
      cannot_answer:
        en: "It is a sensitivity check, not an independent confirmation, and it gives no verdict of its own."
        bn: "এটি একটি সংবেদনশীলতা-যাচাই, স্বাধীন সমর্থন নয়, আর এর নিজের কোনো রায় নেই।"
    colormap: { trend: BrBG, value: Blues }
    valid_range: [0, 300]                # mm/day; a unit check, not a weather limit: real monthly grid values reach 151 (MERRA-2, 1980-2025)
    tags: [water, monsoon, sensitivity]

  # ---------------------------------------------------------------- reference
  - id: global_temp_gistemp
    status: reference
    group: heat
    kind: observations
    source: gistemp_v4
    variable: "Land-ocean global mean anomaly"
    conversion: "°C anomaly (base period VERIFY V-08)"
    name: { en: "Global surface temperature (stations and ships)", bn: "পৃথিবীর ভূপৃষ্ঠের তাপমাত্রা (আবহাওয়া কেন্দ্র ও জাহাজ)" }
    name_mid: { en: "global surface temperature", bn: "পৃথিবীর ভূপৃষ্ঠের তাপমাত্রা" }
    definition:
      en: "How much warmer or cooler the whole planet's surface is than a reference average, from weather stations, ships and buoys."
      bn: "আবহাওয়া কেন্দ্র, জাহাজ ও বয়ার মাপ অনুযায়ী পুরো পৃথিবীর ভূপৃষ্ঠ একটি তুলনা-গড়ের চেয়ে কতটা উষ্ণ বা শীতল।"
    how_measured:
      en: "NASA GISS combines land stations with ship and buoy measurements of the sea surface."
      bn: "নাসা GISS স্থলভাগের আবহাওয়া কেন্দ্রের সঙ্গে জাহাজ ও বয়ার সমুদ্রপৃষ্ঠ-পরিমাপ মিলিয়ে তৈরি করে।"
    units: { monthly: "°C", aggregated: "°C" }
    rule: mean
    ratio_scale: false
    record: { from: 1880, to: null }
    record_card:
      gaps: { en: "None in the global series.", bn: "বৈশ্বিক সিরিজে নেই।" }
      known_breaks: []
      observation_or_model:
        en: "Observations, combined into one global series. Used here only to check our engine against a known answer."
        bn: "পর্যবেক্ষণ, একটি বৈশ্বিক সিরিজে মেলানো। এখানে শুধু জানা উত্তরের সঙ্গে আমাদের হিসাব মেলাতে ব্যবহার হয়।"
      cannot_answer:
        en: "It has one value per month for the whole planet, so it says nothing about Bangladesh or any region."
        bn: "পুরো পৃথিবীর জন্য প্রতি মাসে একটি মান, তাই বাংলাদেশ বা কোনো অঞ্চল সম্পর্কে এটি কিছু বলে না।"
    colormap: { trend: RdBu_r, value: RdBu_r }
    valid_range: [-3, 3]
    tags: [heat, world, reference]

  # ---------------------------------------------------------------- deferred: cards only, "not analysed in this release"
  - id: water_vapor
    status: analysed                     # exploration layer only: not in the pre-registration, so no verdicts
    group: water
    kind: model
    source: merra2_slv
    variable: TQV
    name: { en: "Water vapour in the air", bn: "বাতাসে জলীয় বাষ্প" }
    name_mid: { en: "water vapour in the air", bn: "বাতাসে জলীয় বাষ্প" }
    definition:
      en: "All the invisible water vapour in a column of air, as millimetres of water if it all fell as rain."
      bn: "বাতাসের পুরো স্তম্ভে থাকা অদৃশ্য জলীয় বাষ্প — সবটা বৃষ্টি হয়ে পড়লে কত মিলিমিটার পানি হতো।"
    how_measured: { en: "From MERRA-2, a NASA model.", bn: "MERRA-2 থেকে, নাসার একটি মডেল।" }
    units: { monthly: "mm", aggregated: "mm" }
    rule: mean
    ratio_scale: true
    record: { from: 1980, to: null }
    record_card:
      gaps: { en: "None: the model fills every month.", bn: "নেই: মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system]
      observation_or_model: { en: "Model output.", bn: "মডেলের ফল।" }
      cannot_answer: { en: "Model output on a 0.5° grid, averaged by month: it cannot show the humidity of one town or one day. Exploration only: maps, yearly values and trends, no verdict.", bn: "০.৫° গ্রিডে মাসিক গড় করা মডেলের ফল: এটি কোনো এক শহরের বা এক দিনের আর্দ্রতা দেখাতে পারে না। শুধু অনুসন্ধান: মানচিত্র, বছরওয়ারি মান ও প্রবণতা, কোনো রায় নেই।" }
    tags: [water]

  - id: pressure
    status: analysed                     # exploration layer only: not in the pre-registration, so no verdicts
    group: weather
    kind: model
    source: merra2_slv
    variable: SLP
    name: { en: "Air pressure at sea level", bn: "সমুদ্রপৃষ্ঠে বায়ুচাপ" }
    name_mid: { en: "air pressure at sea level", bn: "সমুদ্রপৃষ্ঠে বায়ুচাপ" }
    definition:
      en: "The weight of the air above, adjusted to sea level."
      bn: "ওপরের বাতাসের ওজন, সমুদ্রপৃষ্ঠের হিসাবে।"
    how_measured: { en: "From MERRA-2; over high mountains the sea-level value is an estimate.", bn: "MERRA-2 থেকে; উঁচু পাহাড়ের ওপর সমুদ্রপৃষ্ঠের মান একটি অনুমান।" }
    units: { monthly: "hPa", aggregated: "hPa" }
    rule: mean
    ratio_scale: false
    record: { from: 1980, to: null }
    record_card:
      gaps: { en: "None: the model fills every month.", bn: "নেই: মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system]
      observation_or_model: { en: "Model output.", bn: "মডেলের ফল।" }
      cannot_answer: { en: "Model output averaged by month: it cannot show a single storm or the pressure in one town. Exploration only: maps, yearly values and trends, no verdict.", bn: "মাসিক গড় করা মডেলের ফল: এটি কোনো একক ঝড় বা কোনো এক শহরের বায়ুচাপ দেখাতে পারে না। শুধু অনুসন্ধান: মানচিত্র, বছরওয়ারি মান ও প্রবণতা, কোনো রায় নেই।" }
    tags: [weather]

  - id: snowfall
    status: analysed                     # exploration layer only: not in the pre-registration, so no verdicts
    group: water
    kind: model
    source: merra2_precip
    variable: PRECSNO
    name: { en: "Snowfall", bn: "তুষারপাত" }
    name_mid: { en: "snowfall", bn: "তুষারপাত" }
    definition:
      en: "Snow falling from the sky, measured as the water it holds once melted."
      bn: "আকাশ থেকে পড়া তুষার, গলে গেলে যতটা পানি হয় সেই হিসাবে মাপা।"
    how_measured: { en: "From MERRA-2, a NASA model that blends many observations.", bn: "MERRA-2 থেকে, নাসার একটি মডেল যা বহু পর্যবেক্ষণ মিশিয়ে তৈরি।" }
    conversion: "PRECSNO (\"snowfall\", kg m⁻² s⁻¹, read in an M2TMNXFLX granule on 14 Nov 2026) × 86 400 → mm/day of water; totals = Σ mm/day × days"
    units: { monthly: "mm/day", aggregated: "mm" }
    rule: sum
    ratio_scale: true
    record: { from: 1980, to: null }
    record_card:
      gaps: { en: "None: the model fills every month from January 1980.", bn: "নেই: ১৯৮০ সালের জানুয়ারি থেকে মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system]
      observation_or_model: { en: "Model output. The rain and snowfall record already includes snow; this one shows the snow on its own.", bn: "মডেলের ফল। বৃষ্টি ও তুষারপাতের রেকর্ডে তুষার আগে থেকেই আছে; এটি শুধু তুষারের অংশটুকু দেখায়।" }
      cannot_answer: { en: "Monthly, on a 0.5° grid: it cannot show snow on the ground, snow depth or a single storm. Exploration only, no verdict.", bn: "মাসিক, ০.৫° গ্রিডে: এটি মাটিতে জমা তুষার, তুষারের গভীরতা বা কোনো একক ঝড় দেখাতে পারে না। শুধু অনুসন্ধান, কোনো রায় নেই।" }
    tags: [water, weather]

  - id: wind_speed
    status: analysed                     # exploration layer only: not in the pre-registration, so no verdicts
    group: weather
    kind: model
    source: merra2_precip
    variable: SPEED
    name: { en: "Wind speed near the surface", bn: "ভূপৃষ্ঠের কাছে বাতাসের গতি" }
    name_mid: { en: "wind speed", bn: "বাতাসের গতি" }
    definition:
      en: "How fast the air moves near the ground, averaged over the month."
      bn: "মাটির কাছে বাতাস কত দ্রুত চলে, মাসজুড়ে গড় করা।"
    how_measured: { en: "From MERRA-2, a NASA model that blends many observations.", bn: "MERRA-2 থেকে, নাসার একটি মডেল যা বহু পর্যবেক্ষণ মিশিয়ে তৈরি।" }
    conversion: "SPEED (\"surface_wind_speed\", m s⁻¹, read in an M2TMNXFLX granule on 14 Nov 2026), the monthly mean speed; no conversion"
    units: { monthly: "m/s", aggregated: "m/s" }
    rule: mean
    ratio_scale: true
    record: { from: 1980, to: null }
    record_card:
      gaps: { en: "None: the model fills every month from January 1980.", bn: "নেই: ১৯৮০ সালের জানুয়ারি থেকে মডেল প্রতিটি মাস পূরণ করে।" }
      known_breaks: [merra2_observing_system]
      observation_or_model: { en: "Model output.", bn: "মডেলের ফল।" }
      cannot_answer: { en: "A monthly mean on a 0.5° grid: it cannot show gusts, storms or the wind in one town. Exploration only, no verdict.", bn: "০.৫° গ্রিডে মাসিক গড়: এটি দমকা হাওয়া, ঝড় বা কোনো এক শহরের বাতাস দেখাতে পারে না। শুধু অনুসন্ধান, কোনো রায় নেই।" }
