# DEFERRED (spec pack v3): not read by any MUST or SHOULD code. Kept unchanged from v2 for the COULD items
# (an SI matcher onto existing cards; deferred products). The v3 wording rule applies if it returns: "consistent with", never "caused by".
# Processes ("suspects", F-20) and kinds of place ("archetypes", Scout F-18 and question flow F-03).
# Wording rule: processes are "associated with" trends, never proven causes, unless the cited source says so.
version: 2

processes:
  - id: greenhouse_warming
    name: { en: "Heat-trapping greenhouse gases", bn: "তাপ আটকে রাখা গ্রিনহাউস গ্যাস" }
    description:
      en: "More carbon dioxide and methane trap heat near the surface, warming the lower air and oceans and adding water vapour."
      bn: "বেশি কার্বন ডাই-অক্সাইড ও মিথেন ভূপৃষ্ঠের কাছে তাপ আটকে রাখে — নিচের বাতাস ও সমুদ্র উষ্ণ হয়, জলীয় বাষ্প বাড়ে।"
    effects:
      - { clue: air_temp, direction: up }
      - { clue: surface_temp_airs, direction: up }
      - { clue: global_temp_gistemp, direction: up }
      - { clue: sea_surface_temp, direction: up }
      - { clue: water_vapor, direction: up }
      - { clue: air_temp_levels, direction: up, levels: [850, 500, 250] }
      - { clue: air_temp_levels, direction: down, levels: [50, 10] }
      - { clue: snow_water, direction: down }
      - { clue: heatwave_days, direction: up }
    opposite:
      en: "The same gases warm the lower atmosphere but cool the stratosphere above it."
      bn: "একই গ্যাস নিচের বায়ুমণ্ডলকে উষ্ণ করে, কিন্তু তার ওপরের স্ট্র্যাটোস্ফিয়ারকে শীতল করে।"
    evidence: [santer_2023_stratosphere, lenssen_2019_gistemp]

  - id: ozone_depletion_recovery
    name: { en: "Ozone-destroying chemicals, then the Montreal Protocol", bn: "ওজোন-ধ্বংসকারী রাসায়নিক, তারপর মন্ট্রিয়ল প্রটোকল" }
    description:
      en: "CFCs thinned the ozone layer, most over Antarctica in spring; after they were banned, the layer began to recover."
      bn: "সিএফসি ওজোন স্তর পাতলা করেছিল, সবচেয়ে বেশি অ্যান্টার্কটিকায় বসন্তকালে; নিষিদ্ধ হওয়ার পর স্তরটি সেরে উঠতে শুরু করেছে।"
    effects:
      - { clue: ozone, direction: down, when: "before about 2000" }
      - { clue: ozone, direction: up, when: "after about 2000" }
      - { clue: ozone_omi, direction: up, when: "after about 2000" }
      - { clue: air_temp_levels, direction: down, levels: [50], when: "polar spring, ozone-loss years" }
    opposite:
      en: "One place, opposite trends in different periods: the trend turned around near 2000."
      bn: "একই জায়গা, ভিন্ন সময়ে উল্টো প্রবণতা: প্রায় ২০০০ সালে প্রবণতার দিক ঘুরে যায়।"
    evidence: [solomon_2016_ozone_healing]

  - id: wildfire_smoke
    name: { en: "Wildfire smoke", bn: "দাবানলের ধোঁয়া" }
    description:
      en: "Bigger, more frequent fires send smoke hundreds or thousands of kilometres downwind, mostly in summer."
      bn: "বড় ও ঘন ঘন দাবানলের ধোঁয়া বাতাসে ভেসে শত শত, এমনকি হাজার কিলোমিটার দূরে যায়, বেশির ভাগ গ্রীষ্মকালে।"
    effects:
      - { clue: haze, direction: up, when: "fire season, downwind" }
      - { clue: haze_model, direction: up, when: "fire season, downwind" }
      - { clue: sunlight, direction: down }
    opposite:
      en: "Smoke can raise summer haze far away even while cleaner cars and factories lower it the rest of the year."
      bn: "পরিষ্কার গাড়ি ও কারখানায় বছরের বাকি সময়ে ধোঁয়াশা কমলেও, দাবানলের ধোঁয়া দূরের জায়গায় গ্রীষ্মের ধোঁয়াশা বাড়াতে পারে।"
    evidence: [eo_smoke_upper_midwest_2023, eo_canada_smoke_2025]

  - id: pollution_growth
    name: { en: "More traffic, power plants and industry", bn: "বেশি যানবাহন, বিদ্যুৎকেন্দ্র ও শিল্প" }
    description:
      en: "Growing cities burn more fuel, releasing NO₂ and particles."
      bn: "বড় হতে থাকা শহরগুলো বেশি জ্বালানি পোড়ায়, ফলে NO₂ ও ক্ষুদ্র কণা বাড়ে।"
    effects:
      - { clue: no2, direction: up }
      - { clue: haze, direction: up }
      - { clue: haze_model, direction: up }
      - { clue: sunlight, direction: down }
    opposite:
      en: "The same activity — burning fuel — is rising in some cities and being cleaned up in others."
      bn: "একই কাজ — জ্বালানি পোড়ানো — কিছু শহরে বাড়ছে, আবার অন্য শহরে পরিষ্কার করা হচ্ছে।"
    evidence: [eo_no2_decade_2016, krotkov_2016, li_2017_so2]

  - id: clean_air_policy
    name: { en: "Clean-air rules and cleaner technology", bn: "নির্মল-বায়ু আইন ও পরিষ্কার প্রযুক্তি" }
    description:
      en: "Cleaner fuels, filters and emission limits cut NO₂ and particles even as economies grow."
      bn: "পরিষ্কার জ্বালানি, ফিল্টার ও নির্গমন-সীমা অর্থনীতি বড় হলেও NO₂ ও ক্ষুদ্র কণা কমায়।"
    effects:
      - { clue: no2, direction: down }
      - { clue: haze, direction: down }
      - { clue: haze_model, direction: down }
      - { clue: sunlight, direction: up }
    opposite:
      en: "Cities that cleaned up show falling NO₂ while fast-growing cities show rising NO₂."
      bn: "যেসব শহর দূষণ কমিয়েছে সেখানে NO₂ কমছে, আর দ্রুত বাড়তে থাকা শহরে NO₂ বাড়ছে।"
    evidence: [eo_no2_decade_2016, krotkov_2016, zhang_2019_china_clean_air]

  - id: dust
    name: { en: "Desert dust", bn: "মরুভূমির ধুলা" }
    description:
      en: "Wind lifts dust from dry land; droughts and land degradation can add more, wetter years less."
      bn: "বাতাস শুকনো ভূমি থেকে ধুলা তোলে; খরা ও ভূমি-ক্ষয় তা বাড়াতে পারে, ভেজা বছরে কমে।"
    effects:
      - { clue: haze, direction: either }
      - { clue: haze_model, direction: either }
    opposite:
      en: "Dust can rise downwind of a drying region while falling where rains return."
      bn: "শুকিয়ে যাওয়া এলাকার বাতাসের পথে ধুলা বাড়তে পারে, আবার যেখানে বৃষ্টি ফিরেছে সেখানে কমতে পারে।"
    evidence: []

  - id: irrigation_pumping
    name: { en: "Pumping groundwater to irrigate crops", bn: "ফসলে সেচের জন্য ভূগর্ভের পানি তোলা" }
    description:
      en: "Wells pull water from underground faster than rain refills it, while the watered fields stay green."
      bn: "নলকূপ বৃষ্টির পূরণের চেয়ে দ্রুত ভূগর্ভ থেকে পানি তোলে, আর সেচ পাওয়া মাঠ সবুজ থাকে।"
    effects:
      - { clue: water_storage, direction: down }
      - { clue: greenness, direction: up, when: "dry season" }
      - { clue: evapotranspiration, direction: up }
      - { clue: soil_moisture, direction: up, when: "irrigated fields" }
    opposite:
      en: "Pumping drains the water underground but makes the fields above greener and cooler: opposite trends in two clues from one cause."
      bn: "পানি তোলায় ভূগর্ভ খালি হয়, কিন্তু ওপরের মাঠ আরও সবুজ ও শীতল হয়: এক কারণ, দুই সূত্রে উল্টো প্রবণতা।"
    evidence: [rodell_2009_india_groundwater, shamsudduha_2022_bengal_water_machine, chen_2019_greening]

  - id: irrigation_cooling
    name: { en: "Evaporative cooling from irrigation", bn: "সেচের বাষ্পীভবনজনিত শীতলতা" }
    description:
      en: "Watered fields release water vapour that cools the ground and the air above it, especially in the hot season."
      bn: "সেচ পাওয়া মাঠ থেকে জলীয় বাষ্প বের হয়, যা মাটি ও তার ওপরের বাতাস শীতল করে — বিশেষ করে গরমের মৌসুমে।"
    effects:
      - { clue: land_surface_temp, direction: down }
      - { clue: air_temp, direction: down, when: "locally, hot season" }
      - { clue: air_temp_max, direction: down }
    opposite:
      en: "Irrigated farmland can cool while nearby cities and dry lands warm."
      bn: "সেচের জমি শীতল হতে পারে, যখন কাছের শহর ও শুকনো জমি উষ্ণ হয়।"
    evidence: []

  - id: urban_heat
    name: { en: "Cities storing heat", bn: "শহরে জমে থাকা তাপ" }
    description:
      en: "Concrete, asphalt and fewer trees make cities hotter than their surroundings, especially at night."
      bn: "কংক্রিট, পিচ ও কম গাছপালার কারণে শহর আশপাশের চেয়ে বেশি গরম হয়, বিশেষ করে রাতে।"
    effects:
      - { clue: land_surface_temp, direction: up }
      - { clue: air_temp_min, direction: up }
      - { clue: air_temp, direction: up, when: "locally" }
    opposite:
      en: "A growing city can warm while farmland around it cools."
      bn: "বড় হতে থাকা শহর উষ্ণ হতে পারে, যখন তার চারপাশের কৃষিজমি শীতল হয়।"
    evidence: []

  - id: greening_land_use
    name: { en: "Tree planting and more intensive farming", bn: "বৃক্ষরোপণ ও নিবিড় চাষাবাদ" }
    description:
      en: "New forests and multiple harvests a year make land greener and move more water into the air."
      bn: "নতুন বন ও বছরে একাধিক ফসল ভূমিকে আরও সবুজ করে এবং বাতাসে বেশি পানি পাঠায়।"
    effects:
      - { clue: greenness, direction: up }
      - { clue: evapotranspiration, direction: up }
      - { clue: land_surface_temp, direction: down }
    opposite:
      en: "Where trees are planted the ground cools; where forests are cleared it warms."
      bn: "যেখানে গাছ লাগানো হয় সেখানে মাটি শীতল হয়; যেখানে বন কাটা হয় সেখানে উষ্ণ হয়।"
    evidence: [chen_2019_greening]

  - id: deforestation_urbanization
    name: { en: "Clearing forests and building cities", bn: "বন উজাড় ও শহর গড়া" }
    description:
      en: "Removing vegetation makes land browner and hotter and sends less water into the air."
      bn: "গাছপালা সরালে ভূমি বাদামি ও গরম হয়, বাতাসে কম পানি যায়।"
    effects:
      - { clue: greenness, direction: down }
      - { clue: land_surface_temp, direction: up }
      - { clue: evapotranspiration, direction: down }
    opposite:
      en: "The mirror image of tree planting: the same physics, the opposite direction."
      bn: "বৃক্ষরোপণের আয়না-প্রতিচ্ছবি: একই পদার্থবিদ্যা, উল্টো দিক।"
    evidence: []

  - id: wet_wetter_dry_drier
    name: { en: "Warmer air moves more water", bn: "উষ্ণ বাতাস বেশি পানি বহন করে" }
    description:
      en: "Warmer air holds about 7% more water vapour per °C, which can make heavy rain heavier and change where rain falls."
      bn: "প্রতি ১ °C উষ্ণতায় বাতাস প্রায় ৭% বেশি জলীয় বাষ্প ধরে রাখে, ফলে ভারী বৃষ্টি আরও ভারী হতে পারে এবং বৃষ্টির জায়গা বদলাতে পারে।"
    effects:
      - { clue: water_vapor, direction: up }
      - { clue: rain, direction: either }
      - { clue: soil_moisture, direction: either }
    opposite:
      en: "Some regions get wetter while others get drier — but the simple 'wet gets wetter' rule fails over most land."
      bn: "কিছু অঞ্চল আরও ভেজা হয়, অন্যগুলো আরও শুকনো — তবে ‘ভেজা আরও ভেজা’ সরল নিয়মটি বেশির ভাগ স্থলভাগে খাটে না।"
    evidence: [greve_2014_wet_dry]

  - id: monsoon_change
    name: { en: "Changes in the monsoon", bn: "বর্ষার পরিবর্তন" }
    description:
      en: "Shifts in ocean and land heating can strengthen or weaken monsoon rain in different parts of a region."
      bn: "সমুদ্র ও স্থলভাগের উষ্ণায়নের তারতম্য একই অঞ্চলের ভিন্ন অংশে বর্ষার বৃষ্টি বাড়াতে বা কমাতে পারে।"
    effects:
      - { clue: rain, direction: either, when: "monsoon season" }
      - { clue: soil_moisture, direction: either }
      - { clue: runoff, direction: either }
    opposite:
      en: "Monsoon rain can decrease in one part of South Asia and increase in another in the same decades."
      bn: "একই দশকে দক্ষিণ এশিয়ার এক অংশে বর্ষার বৃষ্টি কমতে পারে, অন্য অংশে বাড়তে পারে।"
    evidence: [roxy_2015_monsoon]

  - id: enso
    name: { en: "El Niño and La Niña", bn: "এল নিনো ও লা নিনা" }
    description:
      en: "A natural swing of Pacific Ocean temperatures every 2–7 years that shifts rain and heat around the world."
      bn: "প্রতি ২–৭ বছরে প্রশান্ত মহাসাগরের তাপমাত্রার প্রাকৃতিক দোলা, যা সারা পৃথিবীতে বৃষ্টি ও তাপের বণ্টন বদলায়।"
    effects:
      - { clue: rain, direction: either }
      - { clue: air_temp, direction: either }
      - { clue: sea_surface_temp, direction: either }
    opposite:
      en: "El Niño brings drought to Indonesia and Australia but heavy rain to Peru — a natural example of one process, opposite effects. A few big El Niño years near the start or end of a record can tilt a trend (alibi AL7)."
      bn: "এল নিনো ইন্দোনেশিয়া ও অস্ট্রেলিয়ায় খরা আনে, কিন্তু পেরুতে ভারী বৃষ্টি — এক প্রক্রিয়া, উল্টো ফলের প্রাকৃতিক উদাহরণ। রেকর্ডের শুরু বা শেষে কয়েকটি বড় এল নিনো বছর প্রবণতাকে কাত করতে পারে (অ্যালিবাই AL7)।"
    evidence: []

  - id: snow_loss
    name: { en: "Warmer winters and springs", bn: "উষ্ণতর শীত ও বসন্ত" }
    description:
      en: "Less snow builds up and it melts earlier, changing when rivers carry the most water."
      bn: "কম তুষার জমে এবং আগে গলে যায়, ফলে নদীতে সবচেয়ে বেশি পানি কখন থাকে তা বদলে যায়।"
    effects:
      - { clue: snow_water, direction: down }
      - { clue: runoff, direction: up, when: "spring" }
      - { clue: runoff, direction: down, when: "summer" }
    opposite:
      en: "Runoff can rise in spring and fall in summer at the same place — opposite trends in different seasons."
      bn: "একই জায়গায় বসন্তে রানঅফ বাড়তে পারে আর গ্রীষ্মে কমতে পারে — ভিন্ন ঋতুতে উল্টো প্রবণতা।"
    evidence: []

  - id: evaporation_demand
    name: { en: "Hotter air pulls more water from soil and plants", bn: "গরম বাতাস মাটি ও গাছ থেকে বেশি পানি টানে" }
    description:
      en: "Warmer, drier air increases evaporation, which can dry the soil even when rainfall does not change."
      bn: "উষ্ণ ও শুকনো বাতাস বাষ্পীভবন বাড়ায়, ফলে বৃষ্টি না বদলালেও মাটি শুকিয়ে যেতে পারে।"
    effects:
      - { clue: evapotranspiration, direction: up }
      - { clue: soil_moisture, direction: down }
      - { clue: humidity, direction: down }
    opposite:
      en: "More evaporation can mean moister air in one place and drier soil in another."
      bn: "বেশি বাষ্পীভবন মানে এক জায়গায় ভেজা বাতাস, অন্য জায়গায় শুকনো মাটি হতে পারে।"
    evidence: []

  - id: shrinking_lakes
    name: { en: "Rivers diverted away from lakes", bn: "হ্রদ থেকে নদীর পানি সরিয়ে নেওয়া" }
    description:
      en: "When rivers are used for irrigation, the lakes they fed shrink and the water stored in the region falls."
      bn: "নদীর পানি সেচে ব্যবহার করলে যেসব হ্রদ সেই নদী থেকে পানি পেত সেগুলো ছোট হয়, অঞ্চলে জমা পানিও কমে।"
    effects:
      - { clue: water_storage, direction: down }
    opposite:
      en: "Water taken from one basin can make farmland nearby greener while the lake dries."
