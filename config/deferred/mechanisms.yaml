      - { clue: evapotranspiration, why: { en: "Forests pump water into the air; losing them changes that.", bn: "বন বাতাসে পানি পাঠায়; বন হারালে তা বদলায়।" } }
      - { clue: haze_model, why: { en: "Fire smoke rises in dry years.", bn: "শুকনো বছরে আগুনের ধোঁয়া বাড়ে।" } }
