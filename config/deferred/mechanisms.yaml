      bn: "উষ্ণ উপক্রান্তীয় সমুদ্রে ক্লোরোফিল কমতে পারে, আবার কিছু ঠান্ডা উচ্চ-অক্ষাংশের পানিতে বাড়তে পারে।"
    evidence: [polovina_2008_ocean_deserts, cael_2023_ocean_colour]

