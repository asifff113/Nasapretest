      bn: "উষ্ণ উপরিভাগের স্তর ঠান্ডা পানির ওপর ভাসে এবং কম পুষ্টি ওপরে আনে, ফলে সমুদ্রের ক্ষুদ্র উদ্ভিদ কমতে পারে।"
