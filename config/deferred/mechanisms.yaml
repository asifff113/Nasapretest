      - { clue: sea_surface_temp, why: { en: "Shallow coastal water warms quickly.", bn: "অগভীর উপকূলীয় পানি দ্রুত উষ্ণ হয়।" } }
      - { clue: rain, why: { en: "Rain upstream controls how much fresh water reaches the estuary.", bn: "উজানের বৃষ্টি ঠিক করে মোহনায় কতটা মিঠা পানি পৌঁছাবে।" } }
