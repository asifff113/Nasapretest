      - { clue: wind, direction: up, when: "Southern Ocean" }
    opposite:
      en: "Air pressure falls near Antarctica while it rises farther north — one shift in the winds, opposite trends in two belts. The trend paused after about 2000 as the ozone layer began to heal."
      bn: "অ্যান্টার্কটিকার কাছে বায়ুচাপ কমে, অথচ আরও উত্তরে বাড়ে — বাতাসের একটি পরিবর্তন, দুই বলয়ে উল্টো প্রবণতা। প্রায় ২০০০ সালের পর ওজোন স্তর সেরে উঠতে শুরু করায় প্রবণতাটি থেমে যায়।"
    evidence: []     # A adds Thompson & Solomon (2002, Science 296, 895–899) and Banerjee et al. (2020, Nature 579, 544–548) after reading them

archetypes:
  # detect.rules use climatology over the scene from the cube (ANN aggregates over the clue's full record):
  #   stat: mean_annual (mean of yearly values) | max_month_clim (max of the 12-month climatology) |
  #         season_share (season total ÷ annual total; rule sum clues only) | abs_lat (scene centre) |
  #         ocean_fraction (share of scene area that is ocean)
  # A scene matches if it lies inside a place with this archetype OR all rules pass (rules skipped when data missing).
  - id: desert
    name: { en: "Desert", bn: "মরুভূমি" }
    detect:
      rules:
        - { clue: rain, stat: mean_annual, op: lt, value: 250 }
    suggest:
      - { clue: haze, why: { en: "Dust storms change from year to year and with land use.", bn: "ধুলিঝড় বছর ও ভূমি-ব্যবহার অনুযায়ী বদলায়।" } }
      - { clue: rain, why: { en: "Small changes in rare rain matter a lot in deserts.", bn: "মরুভূমিতে বিরল বৃষ্টির ছোট পরিবর্তনও অনেক গুরুত্বপূর্ণ।" } }
      - { clue: land_surface_temp, why: { en: "Bare ground heats strongly in the sun.", bn: "খালি মাটি রোদে খুব গরম হয়।" } }
