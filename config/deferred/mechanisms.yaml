    evidence: []

  - id: annular_mode_shift
    name: { en: "Stronger winds around Antarctica", bn: "অ্যান্টার্কটিকার চারপাশে জোরালো বাতাস" }
    description:
      en: "Since about 1980 the westerly winds circling Antarctica have strengthened in southern summer, a change linked to the ozone hole and greenhouse gases."
      bn: "প্রায় ১৯৮০ থেকে দক্ষিণ গোলার্ধের গ্রীষ্মে অ্যান্টার্কটিকা ঘিরে বয়ে চলা পশ্চিমা বাতাস জোরালো হয়েছে — এই পরিবর্তন ওজোন গহ্বর ও গ্রিনহাউস গ্যাসের সঙ্গে যুক্ত।"
