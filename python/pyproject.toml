[project]
name = "casefile-earth"
version = "1.0.0"
description = "CaseFile Earth: the statistics engine and the data pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "pyhomogeneity>=1.1",
]

[project.optional-dependencies]
# Part 2 (data pipeline) installs these: uv sync --extra pipeline
pipeline = ["earthaccess>=0.11", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10", "netCDF4>=1.6", "shapely>=2.0", "requests>=2.31"]

[project.scripts]
casefile-engine = "casefile_engine.cli:main"
casefile-pipeline = "casefile_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile_engine", "src/casefile_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: rebuilds every example (about 4 minutes)"]

[tool.ruff]
line-length = 160
exclude = ["src/casefile_engine"]   # the engine is frozen, verified code: do not reformat it
